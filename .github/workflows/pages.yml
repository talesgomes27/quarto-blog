name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate rendered languages and study provenance
        run: |
          python3 tests/test_localize.py _site
          python3 tests/test_study_corrections.py
          python3 tests/test_bikeshare_revision.py
          python3 tests/test_quarto_extensions.py
          python3 tests/test_blog_features.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
