project:
  type: website
  render:
    - '*.qmd'
    - en/*.qmd
    - posts/**/*.qmd
  resources:
    - assets/
    - posts/bike-share-navigate/revision-2026-10-26/
    - docs/revisions/2026-10-26/
    - docs/reviews/evidence/bike-share-audit.json
    - scripts/reconcile_bikeshare.R
  post-render:
    - python3 scripts/localize.py

lang: pt-BR
website:
  title: Tales Gomes
  description: Projetos, aprendizados e perspectivas sobre ciência de dados e tecnologia.
  image: social.jpg
  twitter-card: true
  open-graph: true
  favicon: favicon.png
  site-url: https://talesgomes27.github.io/quarto-blog
  repo-url: https://github.com/talesgomes27/quarto-blog
  search:
    type: overlay
  navbar:
    title: Tales Gomes
    collapse-below: lg
    pinned: true
    right:
      - text: Projetos
        href: index.qmd#projetos
      - text: Textos
        href: textos.qmd
      - text: Sobre
        href: about.qmd
      - text: Contato
        href: mailto:talesgomes27@gmail.com
      - text: PT
        href: index.qmd
      - text: EN
        href: en/index.qmd
  page-footer:
    left: '<span id="footer-copy">Feito com Quarto. Por Tales Gomes.</span>'
    right:
      - icon: rss
        href: textos.xml
        aria-label: Acompanhar publicações por RSS
      - icon: github
        href: https://github.com/talesgomes27/
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/talesgomes27/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:talesgomes27@gmail.com
        aria-label: Email
format:
  html:
    filters:
      - ravila4/link-previews
    theme:
      light:
        - default
        - custom.scss
      dark:
        - default
        - custom-dark.scss
    css: styles.css
    toc: false
    title-block-banner: false
    lightbox: true
    citations-hover: true
    footnotes-hover: true
extensions:
  link-previews:
    content: '#title-block-header, h1.title, #quarto-document-content > p:first-of-type'
    max-width: 420
comments:
  giscus:
    repo: talesgomes27/quarto-blog
    repo-id: R_kgDOHeSMkg
    category: General
    category-id: DIC_kwDOHeSMks4CPoEN
    theme:
      light: light
      dark: dark_dimmed
