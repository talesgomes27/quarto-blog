project:
  type: website
  render:
    - '*.qmd'
    - en/*.qmd
    - posts/**/*.qmd
  resources:
    - assets/
  post-render:
    - python3 scripts/localize.py

lang: pt-BR
website:
  title: Tales Gomes
  description: Projetos, aprendizados e perspectivas sobre ciência de dados e tecnologia.
  image: social.jpg
  twitter-card: true
  open-graph: true
  favicon: favicon.png
  site-url: https://talesgomes27.github.io/quarto-blog
  repo-url: https://github.com/talesgomes27/quarto-blog
  search:
    type: overlay
  navbar:
    title: Tales Gomes
    background: light
    collapse-below: lg
    pinned: true
    right:
      - text: Projetos
        href: index.qmd#projetos
      - text: Textos
        href: textos.qmd
      - text: Sobre
        href: about.qmd
      - text: Contato
        href: mailto:talesgomes27@gmail.com
      - text: PT
        href: index.qmd
      - text: EN
        href: en/index.qmd
  page-footer:
    left: '<span id="footer-copy">Feito com Quarto. Por Tales Gomes.</span>'
    right:
      - icon: github
        href: https://github.com/talesgomes27/
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/talesgomes27/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:talesgomes27@gmail.com
        aria-label: Email
format:
  html:
    theme:
      - default
      - custom.scss
    css: styles.css
    toc: false
    title-block-banner: false
    lightbox: true
    citations-hover: true
    footnotes-hover: true
comments:
